user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # The explorer is the only intended caller, but rate limiting keeps a
    # leaked token from being able to hammer the box.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream indexer_api {
        server api:8080;
        keepalive 16;
    }

    # ---- HTTP: ACME challenge + redirect ----
    server {
        listen 80;
        server_name api.mempool.zerochill.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: the API ----
    server {
        listen 443 ssl;
        http2 on;
        server_name api.mempool.zerochill.com;

        ssl_certificate     /etc/letsencrypt/live/api.mempool.zerochill.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mempool.zerochill.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /health {
            proxy_pass http://indexer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location / {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://indexer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Authorization must survive the hop — it is the API's auth.
            proxy_pass_request_headers on;

            proxy_connect_timeout 5s;
            proxy_read_timeout   30s;
        }
    }
}
